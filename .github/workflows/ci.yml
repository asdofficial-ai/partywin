name: PARTYWIN Staging CI

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y unzip
      - run: unzip -q partywin-stage8-staging-qa.zip -d extracted
      - run: python -m pip install -r extracted/partywin-stage8-staging-qa/requirements.txt
      - run: cd extracted/partywin-stage8-staging-qa && python -m pytest -q
      - run: cd extracted/partywin-stage8-staging-qa && python -m py_compile server.py
      - run: cd extracted/partywin-stage8-staging-qa && python scripts/config_check.py
